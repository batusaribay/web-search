[package]
name = "web-search"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Search the web from the terminal"
license = "MIT"
repository = "https://github.com/batusaribay/web-search"
homepage = "https://github.com/batusaribay/web-search"
readme = "README.md"
keywords = ["search", "cli", "web", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "web-search"
path = "src/main.rs"

[dependencies]
dom_smoothie = "0.19.0"
quick-xml = "0.42.0"
scraper = "0.29.0"
serde_json = "1"
ureq = { version = "2", features = ["gzip"] }
url = "2.5.8"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
